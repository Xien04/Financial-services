name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: financial_services_test
          POSTGRES_USER: scaffold_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U scaffold_test -d financial_services_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://scaffold_test:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/financial_services_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.2"
      - run: uv sync --locked
      - run: uv run ruff check backend infra
      - run: uv run ruff format --check backend infra
      - run: uv run mypy
      - run: uv run python backend/manage.py check --settings=config.settings.test
      - run: uv run python backend/manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: uv run python backend/manage.py migrate --noinput --settings=config.settings.test
      - run: uv run python backend/manage.py test tests financial_services --settings=config.settings.test --noinput --verbosity 2
      - name: Audit all locked dependencies
        run: |
          mkdir -p .cache
          uv export --locked --no-emit-project --format requirements-txt --output-file .cache/audit-requirements.txt
          uv run pip-audit --require-hashes --disable-pip -r .cache/audit-requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.2"
      - name: Install the health API for the same-origin smoke test
        working-directory: .
        run: uv sync --locked --no-dev
      - name: Exercise the running frontend
        env:
          PYTHONPATH: ../backend
          DJANGO_SETTINGS_MODULE: config.settings.test
          SMOKE_TEST_URL: http://localhost:3000
          SMOKE_TEST_API: "1"
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          uv run --no-sync python -c 'from wsgiref.simple_server import make_server; from config.wsgi import application; make_server("127.0.0.1", 8000, application).serve_forever()' > "$RUNNER_TEMP/health-api.log" 2>&1 &
          api_pid=$!
          npm start > "$RUNNER_TEMP/scaffold-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null && curl --fail --silent http://127.0.0.1:8000/api/v1/health/live > /dev/null; then
              npm run test:smoke
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/scaffold-web.log"
          cat "$RUNNER_TEMP/health-api.log"
          exit 1

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.2"
      - run: uv sync --locked --no-dev
      - name: Verify the real Compose startup and persistence sequence
        run: uv run --no-sync python infra/verify_compose.py
      - name: Publish sanitized Compose verification evidence
        if: always()
        run: |
          if test -f .cache/compose-verification.json; then
            printf '### Compose verification evidence\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            tee -a "$GITHUB_STEP_SUMMARY" < .cache/compose-verification.json
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.2"
      - run: uv sync --locked
      - run: uv run python infra/scan_secrets.py
